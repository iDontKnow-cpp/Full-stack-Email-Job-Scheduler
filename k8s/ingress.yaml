apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: email-scheduler-ingress
  namespace: email-scheduler
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
    - http:
        paths:
          # Route API requests to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
          # Route Bull Board monitoring to backend
          - path: /admin/queues
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
          # Route all other web traffic to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

