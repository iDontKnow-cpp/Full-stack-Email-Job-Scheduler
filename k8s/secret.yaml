apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: email-scheduler
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "scheduler"
  POSTGRES_PASSWORD: "scheduler123"
  POSTGRES_DB: "email_scheduler"
  DATABASE_URL: "postgresql://scheduler:scheduler123@postgres-service:5432/email_scheduler"

  # JWT & Session Secret
  JWT_SECRET: "k8s-production-jwt-super-secret-key-at-least-32-chars-long"
  SESSION_SECRET: "k8s-production-session-secret-change-me"

  # Google OAuth (Optional in dev/testing, dev-login fallback available)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Slack OAuth (Optional in dev/testing)
  SLACK_CLIENT_ID: ""
  SLACK_CLIENT_SECRET: ""

  # Ethereal Email Credentials (Optional: auto-creates test account if left blank)
  ETHEREAL_USER: ""
  ETHEREAL_PASS: ""

