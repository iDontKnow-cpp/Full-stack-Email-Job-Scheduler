apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-db-push
  namespace: email-scheduler
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: prisma-db-push
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prisma-migrate
          image: ujjwalrajpurohit/full-stack-email-job-scheduler:back.2
          imagePullPolicy: IfNotPresent
          command:
            - npx
            - prisma
            - db
            - push
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
