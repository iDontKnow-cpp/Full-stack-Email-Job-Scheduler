version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler123
      POSTGRES_DB: email_scheduler
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d email_scheduler']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=5s >/dev/null']
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://scheduler:scheduler123@postgres:5432/email_scheduler?schema=public
    command: ['npx', 'prisma', 'db', 'push']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: http://localhost:30080
      DATABASE_URL: postgresql://scheduler:scheduler123@postgres:5432/email_scheduler?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CALLBACK_URL: http://localhost:30080/api/auth/google/callback
      SLACK_REDIRECT_URI: http://localhost:30080/api/slack/callback
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - '3001:3001'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '30080:80'
    depends_on:
      backend-service:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  elasticsearch_data:
